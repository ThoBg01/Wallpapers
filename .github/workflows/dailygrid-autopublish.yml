name: DailyGrid autopublisher

on:
  schedule:
    - cron: '11 4 * * *'
  push:
    paths:
      - 'scripts/dailygrid_generate.py'
      - '.github/workflows/dailygrid-autopublish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dailygrid-autopublish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only DailyGrid files
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            docs/dailygrid
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate today's puzzles
        run: python scripts/dailygrid_generate.py
      - name: Validate output
        run: |
          test -f docs/dailygrid/index.html
          test -f docs/dailygrid/privacy.html
          test -f docs/dailygrid/sitemap.xml
          grep -q "DailyGrid" docs/dailygrid/index.html
          grep -q "Daily Sudoku" docs/dailygrid/index.html
          grep -q "Lights Out" docs/dailygrid/index.html
      - name: Publish generated files
        run: |
          git config user.name "dailygrid-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dailygrid
          if git diff --cached --quiet; then
            echo "No new DailyGrid content."
            exit 0
          fi
          git commit -m "DailyGrid automatic daily puzzles"
          git push
